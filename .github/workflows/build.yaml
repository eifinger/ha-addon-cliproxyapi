---
name: Build app image

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build.yaml"
      - "cliproxyapi/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yaml"
      - "cliproxyapi/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint app configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint app
        uses: frenck/action-addon-linter@f6bef06a4cee6c67924b0a70be643aacb8500a43 # v2.21.0
        with:
          path: ./cliproxyapi

      - name: Read app version
        id: app
        shell: bash
        run: |
          version="$(awk -F '"' '/^version:/ { print $2 }' cliproxyapi/config.yaml)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.arch }} image
    needs: lint
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            build_from: ghcr.io/home-assistant/amd64-base:3.19
          - arch: aarch64
            runner: ubuntu-24.04-arm
            build_from: ghcr.io/home-assistant/aarch64-base:3.19
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./cliproxyapi
          image: ghcr.io/eifinger/${{ matrix.arch }}-app-cliproxyapi
          image-tags: |
            ${{ needs.lint.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=CLIProxyAPI
            io.hass.description=OpenAI- and Claude-compatible OAuth proxy
            io.hass.url=https://github.com/eifinger/ha-addon-cliproxyapi
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          push: ${{ github.event_name != 'pull_request' }}
          version: ${{ needs.lint.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs:
      - lint
      - build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: '["amd64", "aarch64"]'
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: app-cliproxyapi
          image-tags: |
            ${{ needs.lint.outputs.version }}
            latest
          registry-prefix: ghcr.io/eifinger
